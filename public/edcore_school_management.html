    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_DATA));
      } catch (e) {
        return JSON.parse(JSON.stringify(INITIAL_DATA));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn(e);
      }
      render();
    }

    function resetData() {
      state = JSON.parse(JSON.stringify(INITIAL_DATA));
      saveState();
      showToast('Demo data reset to Greenfield seed records.');
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => {
        state.toast = null;
        render();
      }, 3000);
    }

    function promptRecordMark() {
      const studentName = prompt('Enter Student Name:', 'Aarav Sharma');
      if (!studentName) return;
      const score = parseInt(prompt('Enter Score out of 100:', '95')) || 90;
      let grade = 'A1';
      if (score < 91 && score >= 81) grade = 'A2';
      else if (score < 81 && score >= 71) grade = 'B1';
      else if (score < 71 && score >= 61) grade = 'B2';
      const remark = prompt('Enter Teacher Remark:', 'Outstanding performance') || 'Good';

      state.marks.push({
        id: 'm-' + Date.now(),
        studentName: studentName,
        standard: 8,
        section: 'A',
        subject: 'Mathematics',
        score: score,
        maxScore: 100,
        exam: 'Mid-Term Exam',
        grade: grade,
        remarks: remark,
        endorsed: false
      });

      saveState();
      showToast(`Score recorded for ${studentName} (${score}/100 - Grade ${grade}).`);
    }

      const inv = state.fees.find(f => f.id === id);
      if (inv) {
        inv.status = 'paid';
        inv.receiptNo = 'RCP-' + Math.floor(10000 + Math.random() * 90000);
        inv.paidDate = new Date().toISOString().split('T')[0];

        // Also sync student status
        const s = state.students.find(st => st.id === inv.studentId);
        if (s) s.feeStatus = 'paid';

        saveState();
        showToast(`Fee cleared for ${inv.studentName}. Receipt ${inv.receiptNo} generated.`);

    function promptAddBook() {
      const title = prompt('Enter Book Title:');

      state.books.push({

    function promptIssueBook(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book || book.available <= 0) {
        alert('No copies currently available.');
        return;
      }
      const member = prompt('Enter Student Name / ID to issue:', 'Aarav Sharma (Std 8-A)') || 'Aarav Sharma';

      book.available -= 1;
      state.bookIssues.unshift({
        id: 'iss-' + Date.now(),
        issueNo: 'ISS-2026-0' + (state.bookIssues.length + 350),
        bookTitle: book.title,
        memberName: member,
        issueDate: new Date().toISOString().split('T')[0],
        dueDate: '2026-10-28',
        status: 'borrowed'
      });

      saveState();
      showToast(`Book '${book.title}' issued to ${member}.`);
    }

    function returnBook(issueId) {
      const iss = state.bookIssues.find(i => i.id === issueId);

        saveState();
        showToast(`Book '${iss.bookTitle}' returned to shelf.`);
      }
    }

                    const isHol = isSun || isSat || day === 2 || day === 20;
                    const isAbsent = day === 12;
                    const isLeave = day === 6;
                    const isToday = day === 14;
                    const isFuture = day > 14;
                    let cls = 'bg-emerald-50 text-emerald-800 border-emerald-200';
                    if (isHol) cls = 'bg-slate-100 text-slate-400 border-transparent';
                    else if (isFuture) cls = 'bg-slate-50 text-slate-400 border-dashed border-slate-200';
                    else if (isAbsent) cls = 'bg-rose-100 text-rose-800 font-bold border-rose-300';
                    else if (isLeave) cls = 'bg-purple-100 text-purple-800 font-bold border-purple-300';
                    return `<div class="h-7 rounded border flex items-center justify-center text-[10px] ${cls} ${isToday ? 'ring-2 ring-blue-500 font-bold' : ''}">${day}</div>`;
                  }).join('')}
                </div>
              </div>

              <!-- Session Logs -->
              <div class="space-y-1.5 text-xs">
                <span class="font-bold text-slate-900 text-xs block">Recent Attendance Entries</span>
                <div class="p-2.5 rounded-xl border border-slate-200 bg-white flex justify-between items-center">
                  <div>
                    <strong class="text-slate-800 font-mono">2026-10-14 (Today)</strong>
                    <p class="text-[10px] text-slate-400">Morning Assembly Roll-Call</p>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">PRESENT</span>
                </div>
                <div class="p-2.5 rounded-xl border border-slate-200 bg-white flex justify-between items-center">
                  <div>
                    <strong class="text-slate-800 font-mono">2026-10-13</strong>
                    <p class="text-[10px] text-slate-400">Morning Assembly Roll-Call</p>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">PRESENT</span>
                </div>
                <div class="p-2.5 rounded-xl border border-rose-200 bg-rose-50/20 flex justify-between items-center">
                  <div>
                    <strong class="text-slate-800 font-mono">2026-10-12</strong>
                    <p class="text-[10px] text-slate-400">Parent medical note logged: Viral fever</p>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800">ABSENT</span>
                </div>
              </div>
            </div>
          `;
        }

        if (tab === 'assignments') return renderAssignmentsMonitor();
        if (tab === 'profile') {
          return `
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h4 class="font-bold text-slate-900 text-sm">Parent Profile</h4>
              <div>Parent: <strong>Dr. Rajesh Sharma</strong></div>
              <div>Phone: <strong>+91 98765 43210</strong></div>
              <div>Address: <strong>402 Emerald Towers, Greenfield City</strong></div>
            </div>
          `;
        }
      }

      return `<div class="p-4 text-center text-slate-400">Mobile Module ${tab} active.</div>`;
    }

    // Modal: Role Permissions & RBAC Inspector
    function renderRbacModal() {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 overflow-y-auto">
          <div class="bg-white text-slate-900 rounded-2xl max-w-4xl w-full p-6 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div>
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <span>🛡️</span> Role-Based Access Control (RBAC) Security Matrix
                </h3>
                <p class="text-xs text-slate-500">Greenfield International School Institutional Security & Governance</p>

              <button onclick="state.showRbacModal=false; render();" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold">

                  <tr>
                    <th class="py-2.5 px-3">School Module</th>
                    <th class="py-2.5 px-3">Principal (L5)</th>
                    <th class="py-2.5 px-3">Vice Principal (L4)</th>
                    <th class="py-2.5 px-3">Teacher Web (L2)</th>
                    <th class="py-2.5 px-3">Accountant (L3)</th>
                    <th class="py-2.5 px-3">Receptionist (L2)</th>
                    <th class="py-2.5 px-3">Librarian (L2)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-slate-700">
                  ${PERMISSION_MATRIX.map(row => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2.5 px-3 font-semibold text-slate-900">${row.module}</td>
                      <td class="py-2.5 px-3 font-semibold text-rose-700 bg-rose-50/50">${row.principal}</td>
                      <td class="py-2.5 px-3 font-medium text-indigo-700">${row.vice_principal}</td>

                </tbody>

            </div>

            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
              <span>Security Rule: Permissions are strictly enforced based on session role clearance.</span>
              <button onclick="state.showRbacModal=false; render();" class="px-3 py-1 bg-slate-900 text-white rounded-lg text-xs font-semibold">
                Acknowledge
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderToast(msg) {
      return `
        <div class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 text-xs flex items-center gap-2 animate-bounce">
          <span>⚡</span>
          <span>${msg}</span>
        </div>
      `;
    }

    // Initialize Standalone Engine
    render();
  </script>
</body>
</html>
